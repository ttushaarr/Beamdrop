<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="macCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="phoneCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#111116" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Beam Glow -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseBeam {
        0% { stroke-dashoffset: 120; opacity: 0.3; }
        50% { opacity: 1; filter: drop-shadow(0 0 12px #38bdf8); }
        100% { stroke-dashoffset: 0; opacity: 0.3; }
      }
      @keyframes floatParticle {
        0% { transform: translateX(0); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(290px); opacity: 0; }
      }
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes livePulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.3); opacity: 0.6; }
      }
      .beam-line {
        stroke-dasharray: 12 8;
        animation: pulseBeam 2s linear infinite;
      }
      .p1 { animation: floatParticle 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .p2 { animation: floatParticle 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite 0.7s; }
      .p3 { animation: floatParticle 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite 1.4s; }
      .cursor-blink { animation: blinkCursor 1s step-end infinite; }
      .pulse-dot { animation: livePulse 1.8s ease-in-out infinite; transform-origin: center; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Top Header Title -->
  <g transform="translate(600, 56)" text-anchor="middle">
    <rect x="-170" y="-22" width="340" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="-135" cy="-6" r="4" fill="#10b981" class="pulse-dot"/>
    <text x="-122" y="-2" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="start">LOCAL P2P WI-FI BRIDGE • ACTIVE</text>

    <text x="0" y="44" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">BeamDrop: macOS ⟷ Android Instant Link</text>
    <text x="0" y="70" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Zero Cloud • 1-Click Wireless ADB • HD Webcam • Custom Script Launchers</text>
  </g>

  <!-- ================= LEFT: macOS Application Window ================= -->
  <g transform="translate(70, 160)">
    <!-- Shadow -->
    <rect x="0" y="0" width="450" height="410" rx="16" fill="#000" opacity="0.4" filter="url(#glow)"/>
    <!-- Window Frame -->
    <rect x="0" y="0" width="450" height="410" rx="16" fill="url(#macCardGrad)" stroke="#334155" stroke-width="1.5"/>

    <!-- macOS Window Bar -->
    <rect x="0" y="0" width="450" height="40" rx="16" fill="#1e293b"/>
    <rect x="0" y="24" width="450" height="16" fill="#1e293b"/>
    <circle cx="22" cy="20" r="6" fill="#ef4444"/>
    <circle cx="42" cy="20" r="6" fill="#f59e0b"/>
    <circle cx="62" cy="20" r="6" fill="#10b981"/>
    <text x="225" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">BeamDrop — MacBook Pro (Apple Silicon)</text>

    <!-- Incoming Call Alert Card -->
    <g transform="translate(18, 54)">
      <rect width="414" height="64" rx="10" fill="#064e3b" fill-opacity="0.4" stroke="#059669" stroke-width="1.2"/>
      <circle cx="28" cy="32" r="14" fill="#059669" fill-opacity="0.3"/>
      <text x="28" y="38" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" text-anchor="middle">📞</text>
      
      <text x="52" y="26" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700">INCOMING CALL: Mom (+1 555-0199)</text>
      <text x="52" y="44" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">Ringing on Android Phone...</text>

      <!-- Action buttons -->
      <rect x="250" y="20" width="70" height="24" rx="6" fill="#047857"/>
      <text x="285" y="36" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Mute</text>

      <rect x="330" y="20" width="72" height="24" rx="6" fill="#dc2626"/>
      <text x="366" y="36" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Decline</text>
    </g>

    <!-- Drop Zone Card -->
    <g transform="translate(18, 130)">
      <rect width="414" height="120" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6 4"/>
      <circle cx="207" cy="46" r="22" fill="#1e3a8a" fill-opacity="0.5"/>
      <text x="207" y="53" fill="#60a5fa" font-size="20" text-anchor="middle">⚡</text>
      <text x="207" y="86" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Drop Files Here for Zero-Click Delivery</text>
      <text x="207" y="104" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" text-anchor="middle">Auto-routes to Gallery, Movies &amp; Downloads (SHA-256)</text>
    </g>

    <!-- Custom Scripts Row -->
    <g transform="translate(18, 264)">
      <text x="2" y="14" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">🚀 Stream Deck Script Launchers</text>
      
      <!-- Button 1 -->
      <g transform="translate(0, 24)">
        <rect width="130" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="14" y="26" font-size="14">🐙</text>
        <text x="36" y="22" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">Git Status</text>
        <text x="36" y="34" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8">git status</text>
      </g>

      <!-- Button 2 -->
      <g transform="translate(142, 24)">
        <rect width="130" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="14" y="26" font-size="14">🐳</text>
        <text x="36" y="22" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">Docker</text>
        <text x="36" y="34" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8">docker ps</text>
      </g>

      <!-- Button 3 -->
      <g transform="translate(284, 24)">
        <rect width="130" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="14" y="26" font-size="14">⚡</text>
        <text x="36" y="22" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">Free Ports</text>
        <text x="36" y="34" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8">:3000, :8080</text>
      </g>

      <!-- Wireless ADB Status Row -->
      <g transform="translate(0, 80)">
        <rect width="414" height="46" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4"/>
        <text x="14" y="28" font-size="14">⚡</text>
        <text x="36" y="24" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700">1-Click Wireless ADB</text>
        <text x="36" y="37" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">Connected to 192.168.1.2:5555 • Zero USB Cables</text>
        <rect x="340" y="11" width="62" height="24" rx="6" fill="#10b981"/>
        <text x="371" y="27" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle">ONLINE</text>
      </g>
    </g>
  </g>

  <!-- ================= CENTER: Animated Data Flow Beams ================= -->
  <g transform="translate(520, 310)">
    <!-- Wi-Fi Waves -->
    <path d="M 30 -60 Q 80 -100 130 -60" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.4"/>
    <path d="M 45 -45 Q 80 -75 115 -45" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M 60 -30 Q 80 -50 100 -30" stroke="#38bdf8" stroke-width="2.5" fill="none" opacity="1"/>

    <!-- Main Transfer Beam Line -->
    <path d="M 0 0 L 160 0" stroke="url(#beamGrad)" stroke-width="4" stroke-linecap="round" class="beam-line" filter="url(#glow)"/>

    <!-- Reverse Stream Beam Line (Webcam / ADB) -->
    <path d="M 160 40 L 0 40" stroke="url(#beamGrad)" stroke-width="4" stroke-linecap="round" class="beam-line" filter="url(#glow)"/>

    <!-- Particles flowing forward (Mac -> Android) -->
    <circle cx="0" cy="0" r="4" fill="#38bdf8" class="p1" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="4" fill="#60a5fa" class="p2" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="4" fill="#a855f7" class="p3" filter="url(#glow)"/>

    <!-- Transfer Stats Pill -->
    <rect x="25" y="-12" width="110" height="24" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="80" y="4" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">78 MB/s • &lt;5ms</text>

    <!-- Webcam / ADB Stats Pill -->
    <rect x="25" y="28" width="110" height="24" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
    <text x="80" y="44" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">720p 30 FPS</text>
  </g>

  <!-- ================= RIGHT: Android Tablet / Phone Frame ================= -->
  <g transform="translate(680, 160)">
    <!-- Shadow -->
    <rect x="0" y="0" width="450" height="410" rx="20" fill="#000" opacity="0.4" filter="url(#glow)"/>
    <!-- Outer Device Frame -->
    <rect x="0" y="0" width="450" height="410" rx="20" fill="url(#phoneCardGrad)" stroke="#475569" stroke-width="1.5"/>

    <!-- Android Status Bar -->
    <g transform="translate(24, 18)">
      <text x="0" y="10" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700">02:30</text>
      <circle cx="200" cy="6" r="4" fill="#0f172a" stroke="#334155"/>
      <text x="390" y="10" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="end">Wi-Fi 6 ⚡ 84%</text>
    </g>

    <!-- App Header -->
    <g transform="translate(24, 46)">
      <text x="0" y="16" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="800">BeamDrop Receiver</text>
      <rect x="310" y="2" width="90" height="22" rx="11" fill="#1e3a8a"/>
      <text x="355" y="16" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Moto Pad Pro</text>
    </g>

    <!-- HD Webcam Live Viewfinder Card -->
    <g transform="translate(20, 80)">
      <rect width="410" height="120" rx="12" fill="#0f172a" stroke="#1d4ed8" stroke-width="1.2"/>
      
      <!-- Camera Preview Header -->
      <g transform="translate(14, 16)">
        <rect width="70" height="20" rx="4" fill="#dc2626"/>
        <circle cx="12" cy="10" r="4" fill="#ffffff" class="pulse-dot"/>
        <text x="24" y="14" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700">LIVE CAM</text>

        <text x="82" y="14" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">OBS Virtual Cam &amp; Zoom Stream</text>
        
        <rect x="290" y="0" width="88" height="20" rx="4" fill="#334155"/>
        <text x="334" y="14" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="600" text-anchor="middle">Torch • Flip</text>
      </g>

      <!-- URL Preview -->
      <g transform="translate(14, 52)">
        <rect width="382" height="34" rx="6" fill="#1e293b"/>
        <text x="12" y="21" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">http://192.168.1.2:8765/api/v1/webcam/stream</text>
      </g>

      <g transform="translate(14, 98)">
        <text x="0" y="10" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600">✓ Zero latency MJPEG stream ready for OBS Studio / Meet</text>
      </g>
    </g>

    <!-- Terminal Output Live Inspection Card -->
    <g transform="translate(20, 214)">
      <rect width="410" height="176" rx="10" fill="#000000" stroke="#334155" stroke-width="1"/>
      
      <!-- Terminal Header -->
      <rect width="410" height="26" rx="10" fill="#1e293b"/>
      <rect y="16" width="410" height="10" fill="#1e293b"/>
      <circle cx="14" cy="13" r="4" fill="#ef4444"/>
      <circle cx="28" cy="13" r="4" fill="#f59e0b"/>
      <circle cx="42" cy="13" r="4" fill="#10b981"/>
      <text x="205" y="17" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Remote Mac Terminal: git status</text>

      <!-- Terminal Output lines -->
      <g transform="translate(14, 46)" font-family="'JetBrains Mono', monospace" font-size="10">
        <text x="0" y="0" fill="#10b981">$ cd ~/Desktop &amp;&amp; git status</text>
        <text x="0" y="16" fill="#f8fafc">On branch main</text>
        <text x="0" y="32" fill="#38bdf8">Your branch is up to date with 'origin/main'.</text>
        <text x="0" y="48" fill="#94a3b8">Changes not staged for commit:</text>
        <text x="0" y="64" fill="#ef4444">  modified:   src/App.tsx</text>
        <text x="0" y="80" fill="#10b981">Exit Code: 0 (OK)</text>
        <text x="0" y="98" fill="#10b981">$ <tspan fill="#ffffff" class="cursor-blink">█</tspan></text>
      </g>
    </g>
  </g>
</svg>
